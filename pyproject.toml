[project]
name = "flir-cam-gui"
version = "0.1.0"
description = "PyQt6 live-view and camera-control GUI for FLIR Spinnaker (PySpin) cameras"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26",
    "h5py>=3.11",
    "zarr>=3.0",
    "tifffile>=2024.8.30",
    "pyarrow>=26.0.0",
]

[project.optional-dependencies]
# PySpin distributed by FLIR with the Spinnaker SDK (PyPI only has an old,
# unrelated "pyspin"); resolved from the vendored wheel below.
spinnaker = ["spinnaker-python==4.4.0.246"]

[project.scripts]
flir-cam = "flir_cam_gui.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
spinnaker-python = { path = "vendor/spinnaker_python-4.4.0.246-cp312-cp312-win_amd64.whl" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pyqtgraph 0.14.0 (the current release) still assigns to ``ndarray.shape``
# inside its ImageItem downsampling helper, which NumPy 2.5 deprecates.  The
# warning is raised entirely inside the dependency (once per painted frame),
# so it is silenced here by exact message and module; keep the rest visible so
# real warnings from this project still fail the run.  Drop this entry once
# pyqtgraph ships the np.reshape fix.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\\.5:DeprecationWarning:pyqtgraph",
]

[dependency-groups]
dev = ["pytest>=8"]
